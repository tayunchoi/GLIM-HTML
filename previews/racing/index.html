<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>글림 게임 미리보기 · 한글 레이싱 (2단계 · 2차선 하)</title>
<link href="../../assets/fonts/jua.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1c2a3f;overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:'Jua','Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}
  #wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin-left:-640px;margin-top:-360px;transform-origin:50% 50%;}
  #cv{position:absolute;inset:0;width:1280px;height:720px;display:block;}
  #ui{position:absolute;inset:0;pointer-events:none;}
  @keyframes glm7_rabbit_leg{0%,100%{transform:rotate(-8deg) scaleY(1)}50%{transform:rotate(8deg) translateY(-3%) scaleY(.92)}}
  @keyframes glm7_rabbit_bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-7px) scaleY(1.035)}}
  @keyframes glm_armswing{0%,100%{transform:rotate(6deg) translateY(2px)}50%{transform:rotate(-6deg) translateY(-3px)}}
  @keyframes glm_runlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes glm_dust{0%{opacity:.85;transform:translateY(0) scale(.3)}55%{opacity:.4}100%{opacity:0;transform:translateY(16px) scale(1.15)}}
  #racer{position:absolute;left:0;top:0;width:150px;will-change:transform;z-index:8;}
  #racer .shadow{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:70%;height:16px;border-radius:50%;background:rgba(70,50,30,.22);}
  #racer .dust{position:absolute;bottom:14px;width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid rgba(120,110,130,.5);animation:glm_dust .4s ease-out infinite;}
  #jumpbox{transition:none;}
  #steer{transition:transform .12s ease;transform-origin:50% 88%;}
  #runlow{animation:glm_runlow .17s ease-in-out infinite;transform-origin:50% 95%;}
  #rig{position:relative;width:100%;padding-bottom:102.8%;transform-origin:50% 100%;animation:glm7_rabbit_bob .34s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(70,50,30,.22));}
  #rig img{position:absolute;pointer-events:none;}
  #rig .legL{left:27.24%;top:75.89%;width:23.58%;height:24.11%;transform-origin:50% 12%;animation:glm7_rabbit_leg .34s ease-in-out infinite -.17s;}
  #rig .legR{left:49.59%;top:75.89%;width:23.58%;height:24.11%;transform-origin:50% 12%;animation:glm7_rabbit_leg .34s ease-in-out infinite;}
  #rig .armL{left:20.73%;top:56.92%;width:14.23%;height:21.34%;transform-origin:70% 14%;animation:glm_armswing .34s ease-in-out infinite;}
  #rig .armR{left:65.45%;top:56.92%;width:14.23%;height:21.34%;transform-origin:30% 14%;animation:glm_armswing .34s ease-in-out infinite -.17s;}
  #rig .body{left:0;top:0;width:100%;height:100%;}
  #wrap[data-paused] #rig, #wrap[data-paused] #rig img, #wrap[data-paused] #runlow{animation-play-state:paused;}
  #racer.hit #rig{filter:drop-shadow(0 0 14px rgba(255,80,80,.9)) brightness(1.2);}
  @keyframes promptbob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
  #prompt{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:11;pointer-events:auto;cursor:pointer;animation:promptbob 3s ease-in-out infinite;}
  #prompt .frame{width:138px;height:138px;border-radius:28px;background:#fff;border:5px solid #6b4f3a;box-shadow:0 7px 0 #6b4f3a,0 14px 24px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #prompt img{width:88%;height:88%;object-fit:contain;}
  #prompt .spk{position:absolute;right:-10px;bottom:-6px;width:38px;height:38px;border-radius:50%;background:#ffd84d;border:4px solid #6b4f3a;display:flex;align-items:center;justify-content:center;font-size:18px;}
  #prompt.side{left:215px;top:14px;transform:none;animation:none;}
  #prompt.side .frame{width:112px;height:112px;}
  #prompt.weak .frame{border-color:#c0392b;box-shadow:0 7px 0 #c0392b,0 0 30px rgba(255,80,80,.6);}
  #hud{position:absolute;left:22px;top:20px;display:flex;flex-direction:column;gap:8px;z-index:11;}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border:3px solid #6b4f3a;border-radius:999px;padding:6px 14px;font-size:22px;color:#4a3628;box-shadow:0 4px 0 #6b4f3a;}
  #gates{display:flex;gap:5px;} #gates i{width:18px;height:18px;border-radius:50%;background:#e9e3d8;border:2px solid #6b4f3a;display:block;} #gates i.ok{background:#5ed66e;} #gates i.no{background:#ff7b7b;}
  #score{position:absolute;right:22px;top:20px;z-index:11;}
  #bosshud{position:absolute;right:22px;top:72px;z-index:11;display:none;flex-direction:column;align-items:flex-end;gap:6px;}
  #bosshud.on{display:flex;}
  #bosshud .hp{font-size:28px;letter-spacing:4px;}
  @keyframes bannerpop{0%{opacity:0;transform:translate(-50%,-40%) scale(.8)}18%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}}
  #banner{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:20;text-align:center;display:none;}
  #banner.show{display:block;animation:bannerpop 1.9s ease forwards;}
  #banner.long.show{animation-duration:2.6s;}
  #banner h1{margin:0;font-size:64px;color:#fff;text-shadow:0 5px 0 #6b4f3a,0 10px 24px rgba(0,0,0,.3);font-weight:400;white-space:nowrap;}
  #banner.red h1{color:#ffd1d1;text-shadow:0 5px 0 #7a1b1b,0 10px 24px rgba(0,0,0,.4);font-size:84px;}
  #banner p{margin:6px 0 0;font-size:30px;color:#fff6d8;text-shadow:0 3px 0 #6b4f3a;}
  @keyframes bigpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}26%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
  #big{position:absolute;left:50%;top:40%;z-index:20;font-size:88px;color:#fff;text-shadow:0 6px 0 #6b4f3a,0 12px 20px rgba(0,0,0,.25);display:none;white-space:nowrap;}
  #big.show{display:block;animation:bigpop .9s ease forwards;}
  #overlay{position:absolute;inset:0;background:rgba(20,30,50,.55);z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:auto;}
  #overlay[hidden]{display:none;}
  .card{background:#fffaf0;border:5px solid #6b4f3a;border-radius:34px;padding:30px 40px;text-align:center;box-shadow:0 10px 0 #6b4f3a,0 24px 40px rgba(0,0,0,.3);min-width:560px;max-width:1100px;}
  .card h2{margin:0 0 6px;font-size:44px;color:#4a3628;font-weight:400;}
  .card p{margin:0 0 14px;font-size:22px;color:#8a6f5c;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#ffd84d;border:4px solid #6b4f3a;border-radius:999px;padding:12px 26px;font-size:26px;color:#4a3628;box-shadow:0 6px 0 #6b4f3a;cursor:pointer;margin:5px;font-family:inherit;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6b4f3a;}
  .btn.sub{background:#fff;} .btn.boss{background:#ffb3b3;} .btn.boss2{background:#c9b8ff;}
  .stages{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 4px;}
  .stages .btn{font-size:20px;padding:9px 16px;}
  .stars{font-size:54px;letter-spacing:6px;margin:4px 0 10px;}
  .hint{font-size:17px;color:#a08a78;margin-top:8px;line-height:1.5;}
  #touch{position:absolute;inset:0;z-index:9;pointer-events:auto;}
  #jumpbtn{position:absolute;right:34px;bottom:34px;width:118px;height:118px;border-radius:50%;background:#ffd84d;border:5px solid #6b4f3a;box-shadow:0 7px 0 #6b4f3a;z-index:12;pointer-events:auto;display:none;align-items:center;justify-content:center;font-size:30px;color:#4a3628;flex-direction:column;line-height:1;}
  #jumpbtn.on{display:flex;} #jumpbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #6b4f3a;}
  #jumpbtn small{font-size:16px;margin-top:4px;}
  #tips{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:11;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);opacity:.9;background:rgba(0,0,0,.22);padding:6px 16px;border-radius:999px;white-space:nowrap;}
  #dark{position:absolute;inset:0;background:#0b1024;opacity:0;z-index:7;transition:opacity .9s ease;}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:25;}
  #hint{position:absolute;left:50%;top:190px;transform:translateX(-50%);z-index:12;background:rgba(255,255,255,.95);border:3px solid #6b4f3a;border-radius:18px;padding:8px 18px;font-size:22px;color:#4a3628;box-shadow:0 4px 0 #6b4f3a;display:none;white-space:nowrap;}
  #hint.show{display:block;}
  /* ---- 홈페이지 미리보기 전용 ---- */
  html,body{background:#3f9d4f;}
  #overlay,#tips,#jumpbtn,#hint,#prompt .spk{display:none!important;}
  #touch,#prompt{pointer-events:none!important;}
  #hud{left:var(--pv-inset,22px);} #score{right:var(--pv-inset,22px);}
  @keyframes pv_tap{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:.95}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
  #pvTap{position:absolute;top:610px;left:0;width:120px;height:120px;border-radius:50%;border:8px solid #fff;background:rgba(255,216,77,.5);box-shadow:0 0 0 4px #6b4f3a;opacity:0;z-index:13;pointer-events:none;transform:translate(-50%,-50%);}
  #pvTap.show{animation:pv_tap .7s ease-out forwards;}
  #pvHand{position:absolute;top:610px;left:0;width:64px;height:74px;z-index:14;pointer-events:none;opacity:0;transition:opacity .15s;transform:translate(-18%,-8%);filter:drop-shadow(0 4px 0 rgba(107,79,58,.35));}
  #pvHand.show{opacity:1;}
</style>
</head>

<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="dark"></div>
  <div id="ui">
    <div id="hud"><div class="pill" id="stageLabel">1단계</div><div class="pill" id="gates"></div></div>
    <div id="score" class="pill">⭐ 0</div>

    <div id="prompt" title="다시 듣기"><div class="frame"><img id="promptImg" alt=""></div><div class="spk">🔊</div></div>

      <div id="jumpbox"><div id="steer"><div id="runlow"><div id="rig"><img class="legL" alt=""><img class="legR" alt=""><img class="armL" alt=""><img class="armR" alt=""><img class="body" alt=""></div></div></div></div></div>
    <div id="banner"><h1 id="bTitle"></h1><p id="bSub"></p></div>
    <div id="big"></div>
    <div id="tips">◀ ▶ 왼쪽·오른쪽 터치로 차선 바꾸기 · 위로 쓸어올리기 / 점프 버튼 / 스페이스 = 점프</div>
    <div id="touch"></div>
    <div id="pvTap" aria-hidden="true"></div>
    <svg id="pvHand" viewBox="0 0 42 48" fill="none" aria-hidden="true"><path d="M7 3 35 28 23 29 18 42 7 3Z" fill="#fff" stroke="#6b4f3a" stroke-width="3.5" stroke-linejoin="round"/></svg>
    <div id="jumpbtn">⤴<small>점프</small></div>
    <div id="flash"></div>
    <div id="overlay"><div class="card" id="card"></div></div>
  </div>
</div>

  '바위':{c:'#9aa3ad',c2:'#6f7983',w:.78,h:.62,shape:'rock'},
  '통나무':{c:'#b07a4a',c2:'#7d5232',w:.92,h:.5,shape:'log'},
  '건초':{c:'#e9c15a',c2:'#b48c2a',w:.82,h:.66,shape:'hay'},
  '높은울타리':{c:'#c6935f',c2:'#7d5232',w:.95,h:1.1,shape:'fence'},
  '낮은울타리':{c:'#c6935f',c2:'#7d5232',w:1,h:.42,shape:'lowfence'},
  '도랑':{c:'#4a86c8',c2:'#2b4f78',w:1,h:.22,shape:'ditch'},
};

/* ====== 화면·투영 (cam 0=원근 시점, 1=기존 index 평면 시점) ====== */
const W=1280,H=720, cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const HY=258, Y0=612, CX=640, RW0=470, ZFAR=9, JZ=1.35, FAR=0.11;
const RWF=300, LINK=86, SFLAT=.62;   /* 평면 시점: 도로 반폭·z당 픽셀·물체 크기 */
let cam=0;
function pz(z){return Math.max(z,.3);}
function psc(z){const zz=pz(z);return zz<=1?1/zz:FAR+(1-FAR)/zz;}
function sc(z){return (1-cam)*psc(z)+cam*(RWF/RW0);}            /* 가로 위치·폭 */
function sz(z){return (1-cam)*psc(z)+cam*SFLAT;}                 /* 물체 크기 */
function py(z){return (1-cam)*(HY+(Y0-HY)/pz(z))+cam*(Y0-(z-1)*LINK);}
const XO_DZ=.1, XO_N=Math.ceil((ZFAR+3-1)/XO_DZ)+2; const XO=new Float32Array(XO_N);
function curveAt(D){return 34*Math.sin(D*.21)+22*Math.sin(D*.083+2)+9*Math.sin(D*.37+1);}
function buildCurve(dist){let dx=0,x=0;XO[0]=0;for(let i=1;i<XO_N;i++){const z=1+i*XO_DZ;dx+=(CURVY?curveAt(dist+z):0)*XO_DZ;x+=dx*XO_DZ;XO[i]=x;}}
function xoff(z){if(z<=1)return 0;const f=(z-1)/XO_DZ,i=Math.min(XO_N-2,f|0),r=f-i;return (XO[i]+(XO[i+1]-XO[i])*r)*(1-cam);}
function px(x,z){return CX+(x+xoff(z))*sc(z);}
function laneX(l,lanes){const w=2*RW0/lanes;return -RW0+w*(l+.5);}

/* ====== 상태 ====== */
let S=null; Object.defineProperty(window,'S',{get:()=>S});
for(const k of ['legL','legR','armL','armR','body'])document.querySelector('#rig .'+k).src=ASSETS.rabbit[k];
const bossImg=new Image();bossImg.src=ASSETS.boss;
const $=id=>document.getElementById(id);
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function laneOf(ch,lanes){return ch==='L'?0:ch==='R'?lanes-1:(lanes===3?1:0);}
function parseSeg(str,lanes){ /* '■바위L,■바위L' / '■건초L+■건초C×2' / '⤴낮은울타리' */
  const out=[];str.split(',').forEach(part=>{let n=1;const m=part.match(/×(\d+)$/);if(m){n=+m[1];part=part.replace(/×\d+$/,'');}
    const its=part.split('+').map(p=>{p=p.trim();const t=p[0];const name=p.slice(1).replace(/[LCR]$/,'');const lc=p.match(/[LCR]$/);return {t,name,lanes:t==='⤴'?null:[laneOf(lc?lc[0]:'C',lanes)]};});
    for(let i=0;i<n;i++)its.forEach(it=>out.push(Object.assign({},it)));});
  return out;
}
function buildQueue(st){
  const per=st.intro?1:3; let q=[];
  for(let p=0;p<per;p++){let r=shuf([0,1,2]);if(q.length&&r[0]===q[q.length-1])r.push(r.shift());q=q.concat(r);}
  q=q.slice(0,st.gates);
  return q.map(ci=>{let opts;if(st.lanes>=3)opts=shuf([0,1,2]);else{const d=shuf([0,1,2].filter(i=>i!==ci))[0];opts=shuf([ci,d]);}return {correct:ci,opts,lane:opts.indexOf(ci)};});
}
function startStage(idx){
  const st=STAGES[idx]; const Tg=T[st.spd]; cam=0;
  S={idx,st,lanes:st.lanes,Tg,spd:(ZFAR-JZ)/Tg,q:buildQueue(st),gates:[],obs:[],trees:[],flowers:[],parts:[],fx:[],
     lane:(st.lanes===3?1:0),laneX:0,targetLane:(st.lanes===3?1:0),dist:0,t:0,rt:0,last:performance.now(),
     results:[],hits:0,dodges:0,score:0,running:false,slow:1,airUntil:-1,done:false,boss:null,camTarget:0,timers:[]};
  S.laneX=laneX(S.lane,S.lanes);
  for(let i=0;i<22;i++)S.trees.push(mkTree(1+Math.random()*(ZFAR+3)));
  for(let i=0;i<30;i++)S.flowers.push(mkFlower(1+Math.random()*(ZFAR+3)));
  /* 일정: 문 k 도착 rt = t0 + k*T, 장애물은 ● 구간(문 k ~ k+1 사이) */
  const t0=2.2; S.gates=S.q.map((item,k)=>({z:99,arrive:t0+k*Tg,item,judged:false,doors:item.opts.map((wi,l)=>({wi,l,broken:false,wrong:false,shake:0})),gateIdx:k}));
  if(st.fx){[...st.fx.pat].forEach((ch,k)=>{if(ch!=='●')return;const segStr=st.fx.segs.shift&&st.fx.segs[st.fx.pat.slice(0,k).split('●').length-1];const seg=segStr?parseSeg(segStr,st.lanes):[];
    const n=seg.length; seg.forEach((it,i)=>{let frac=.5+(i-(n-1)/2)*(.8/Tg);frac=Math.max(.22,Math.min(.86,frac));S.obs.push(Object.assign(it,{arrive:t0+k*Tg+frac*Tg,judged:false,id:k*10+i}));});});}
  $('stageLabel').textContent=st.boss?st.label.split(' · ')[0]:st.label.split(' · ').slice(0,2).join(' · ');
  $('score').textContent='⭐ 0'; renderGateDots();
  $('overlay').hidden=true; $('wrap').removeAttribute('data-paused'); $('bosshud').classList.remove('on'); $('dark').style.opacity=0; $('prompt').classList.remove('weak');$('prompt').classList.remove('side');
  $('jumpbtn').classList.toggle('on',!!(st.fx&&/⤴/.test(st.fx.segs.join())));
  banner(st.label.split(' · ')[0], st.intro?'천천히 따라와요 🐰':(st.boss?'먼저 달려요 → 곧 보스가 나타나요':(st.lanes+'차선 · '+SPN[st.spd]+' · 출발!')));
  updatePrompt(null);
}
function mkTree(z){const side=Math.random()<.5?-1:1;return {z,x:side*(RW0+140+Math.random()*520),h:150+Math.random()*90,c:['#4caf6b','#3f9d5c','#63bd7a','#2f8a4e'][Math.random()*4|0],kind:Math.random()<.25?'pine':'round'};}
function mkFlower(z){const side=Math.random()<.5?-1:1;return {z,x:side*(RW0+30+Math.random()*560),c:['#ff8fab','#ffd84d','#fff','#ff6b6b','#b388ff'][Math.random()*5|0]};}
function later(fn,ms){const id=setTimeout(()=>{if(S)fn();},ms);if(S)S.timers.push(id);}
function updatePrompt(w){const im=$('promptImg');if(!w){im.removeAttribute('src');im.style.opacity=0;return;}im.src=ASSETS.icons[w];im.style.opacity=1;}
function say(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.65;speechSynthesis.speak(u);}catch(e){}}
$('prompt').addEventListener('click',()=>{if(S&&S.cur)say(WORDS[S.cur.item.correct]);});

/* ====== 조작 ====== */
function move(d){if(!S||!S.running||S.done)return;S.targetLane=Math.max(0,Math.min(S.lanes-1,S.targetLane+d));const el=$('steer');el.style.transform='rotate('+(d*9)+'deg)';setTimeout(()=>{el.style.transform='rotate(0)';},140);}
function jump(){if(!S||!S.running||S.done)return;if(S.rt<S.airUntil)return;S.airUntil=S.rt+.68;S.jumpAt=S.rt;sfx('jump');}
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){move(-1);e.preventDefault();}else if(e.key==='ArrowRight'){move(1);e.preventDefault();}else if(e.key===' '||e.key==='ArrowUp'){jump();e.preventDefault();}});
const touch=$('touch'); let t0p=null;
touch.addEventListener('pointerdown',e=>{t0p={x:e.clientX,y:e.clientY};});
touch.addEventListener('pointerup',e=>{if(!t0p)return;const dx=e.clientX-t0p.x,dy=e.clientY-t0p.y;t0p=null;
  if(dy<-50&&Math.abs(dy)>Math.abs(dx)){jump();return;}
  if(Math.abs(dx)>40){move(dx>0?1:-1);return;}
  const r=touch.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1);});
$('jumpbtn').addEventListener('pointerdown',e=>{e.stopPropagation();jump();});

/* ====== 판정 ====== */
function judgeGate(g){
  g.judged=true;const item=g.item;const ok=(S.lane===item.lane)&&Math.abs(S.laneX-laneX(S.lane,S.lanes))<40;
  const d=g.doors[S.lane];
  if(g.bossGate){bossGateResult(ok,g,d);return;}
  S.results.push(ok);renderGateDots();
  if(ok){d.broken=true;d.brokenAt=S.t;burst(S.laneX,JZ,'#ffd84d');S.score+=10;sfx('correct');big(['좋아요!','잘했어요!','최고!'][Math.random()*3|0]);}
  else{if(d)d.wrong=true,d.shake=1;sfx('wrong');big('다시 해봐요');S.slow=.55;later(()=>{S.slow=1;},600);const c=g.doors[item.lane];if(c)c.reveal=1;}
  $('score').textContent='⭐ '+S.score;
  const nextG=S.gates.find(x=>!x.judged&&!x.bossGate);
  if(!nextG){ if(S.st.boss){later(()=>bossStart(),600);} else {S.done=true;later(finish,1500);} }
}
function judgeOb(o){
  o.judged=true;let hit;
  if(o.t==='⤴')hit=!(S.rt<S.airUntil);else hit=o.lanes.indexOf(S.lane)>=0&&Math.abs(S.laneX-laneX(S.lane,S.lanes))<60;
  if(hit){S.hits++;S.score=Math.max(0,S.score-3);S.slow=.5;later(()=>{S.slow=1;},600);sfx('hit');big(o.boss?'아얏!':'쿵!');shake(320);
    const r=$('racer');r.classList.add('hit');later(()=>r.classList.remove('hit'),500);o.hitFx=S.t;}
  else{S.dodges++;S.score+=2;if(o.t==='⤴')big('넘었다! ⤴');else if(o.boss)big('피했다!');}
  $('score').textContent='⭐ '+S.score;
}
function finish(){
  S.running=false;const n=S.results.length,ok=S.results.filter(Boolean).length;
  const stars=ok>=n-1?3:(ok>=Math.ceil(n*.66)?2:1);
  $('card').innerHTML='<h2>'+S.st.label.split(' · ')[0]+' 완주! 🏁</h2><div class="stars">'+'⭐'.repeat(stars)+'<span style="opacity:.25">'+'⭐'.repeat(3-stars)+'</span></div><p>정답 '+ok+' / '+n+' · 장애물 회피 '+S.dodges+' · 충돌 '+S.hits+' · 점수 '+S.score+'</p>'
    +(S.idx+1<STAGES.length?'<button class="btn" id="next">다음 ▶ '+STAGES[S.idx+1].label.split(' · ').slice(1).join(' · ')+'</button>':'')+'<button class="btn sub" id="retry">다시</button><button class="btn sub" id="menu">단계 고르기</button>';
  $('overlay').hidden=false;$('wrap').setAttribute('data-paused','');sfx('clear');
  const nx=$('next');if(nx)nx.onclick=()=>startStage(S.idx+1);$('retry').onclick=()=>startStage(S.idx);$('menu').onclick=menu;
}
function menu(){
  if(S)S.timers.forEach(clearTimeout);
  $('card').innerHTML='<h2>한글 레이싱 · 시점 전환 + 장애물 + 보스</h2><p>그림과 같은 글자 문으로 달리고, 장애물은 비키거나 뛰어넘고, 보스 공격은 피한 뒤 약점 문을 통과해요</p><div class="stages" id="stageBtns"></div><div class="hint">단어나라 1세트(배·소·귀) · 원본 GLIM_M 규칙 그대로: 문 9개(하3.3/중2.5/상1.8초), 장애물 대본 WORD_FIXED, 충돌 시 0.5배 600ms·−3점, 보스 WORD_BOSS[0] 까마귀 대장(HP1·공격2·경고1.8초)</div>';
  const box=$('stageBtns');STAGES.forEach((st,i)=>{const b=document.createElement('button');b.className='btn'+(st.boss?(st.cam?' boss2':' boss'):'');b.textContent=st.label;b.onclick=()=>startStage(i);box.appendChild(b);});
  $('overlay').hidden=false;$('wrap').setAttribute('data-paused','');$('bosshud').classList.remove('on');$('dark').style.opacity=0;S=null;cam=0;updatePrompt(null);$('jumpbtn').classList.remove('on');$('hint').classList.remove('show');
}
function renderGateDots(){const g=$('gates');g.innerHTML='';for(let i=0;i<S.q.length;i++){const d=document.createElement('i');if(S.results[i]===true)d.className='ok';else if(S.results[i]===false)d.className='no';g.appendChild(d);}}
function banner(t,s,cls){const b=$('banner');$('bTitle').textContent=t;$('bSub').textContent=s||'';b.className='';void b.offsetWidth;b.className='show'+(cls?' '+cls:'');}
function big(t){const b=$('big');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
function hint(t,ms){const h=$('hint');h.textContent=t;h.classList.add('show');later(()=>h.classList.remove('show'),ms||2600);}
function burst(x,z,c,n){for(let i=0;i<(n||26);i++){const a=Math.random()*Math.PI*2,v=120+Math.random()*260;S.parts.push({x:px(x,z),y:py(z)-70,vx:Math.cos(a)*v,vy:Math.sin(a)*v-180,life:.9+Math.random()*.4,c:i%3?c:'#fff',r:6+Math.random()*9,rot:Math.random()*6});}}
function shake(ms){const w=$('wrap');const t0=performance.now();(function f(){const k=performance.now()-t0;if(k>ms||!S){w.style.marginLeft='-640px';w.style.marginTop='-360px';return;}w.style.marginLeft=(-640+(Math.random()-.5)*14)+'px';w.style.marginTop=(-360+(Math.random()-.5)*14)+'px';requestAnimationFrame(f);})();}
function flash(){const f=$('flash');f.style.transition='none';f.style.opacity=.9;requestAnimationFrame(()=>{f.style.transition='opacity .5s';f.style.opacity=0;});}

/* ====== 보스 (WORD_BOSS[0] 까마귀 대장) ====== */
const BOSS={name:'들판의 까마귀 대장',roar:'까악—!',hp:1,atk:2,seq:['A1','A1'],warn:1.8,rest:2.0,gateT:3.3,autoAfter:2};
function bossStart(){
  const B=S.boss={hp:BOSS.hp,hpMax:BOSS.hp,round:1,phase:'enter',state:'hidden',t0:S.t,x:0,y:0,bob:0,flash:0,wp:null,tries:0,face:null};
  S.running=true; /* 길은 계속 달린다 */
  $('prompt').classList.add('side');
  $('bossName').textContent='🐦‍⬛ '+BOSS.name; renderHp();
  if(S.st.cam){ /* 방식②: '보스 공격!!' → 시점이 기존 index 평면 시점으로 */
    banner('보스 공격!!','','red');sfx('roar');shake(700);$('dark').style.opacity=.55;
    later(()=>{S.camTarget=1;},900);
    later(()=>{$('dark').style.opacity=0;B.state='enter';sfx('roar');shake(500);},2300);
    later(()=>{banner(BOSS.name+'!',BOSS.roar);say(BOSS.name);},3200);
    later(()=>{$('bosshud').classList.add('on');B.state='fight';B.phase='fight';hint('↔️ 빨간 표시가 뜨는 길에서 비켜요!',3000);bossRound();},4800);
  }else{ /* 방식①: 지금 시점 그대로 */
    $('dark').style.opacity=.5;sfx('warn');
    later(()=>{shake(600);sfx('roar');B.state='enter';},1400);
    later(()=>{$('dark').style.opacity=0;banner(BOSS.name+'!',BOSS.roar);say(BOSS.name);},2600);
    later(()=>{$('bosshud').classList.add('on');B.state='fight';B.phase='fight';hint('↔️ 빨간 표시가 뜨는 길에서 비켜요!',3000);bossRound();},4200);
  }
}
function renderHp(){const B=S.boss;$('bossHp').innerHTML='❤'.repeat(B.hp)+'<span style="opacity:.25">'+'❤'.repeat(B.hpMax-B.hp)+'</span>';}
function bossRound(){
  const B=S.boss;B.phase='attack';let at=S.rt+1.0;let last=-1;
  BOSS.seq.forEach((pat,i)=>{
    let lane; if(B.round===1&&BOSS.hp===1&&i<2)lane=(i===0)?S.lanes-1:0; /* 첫 만남: 좌·우 한 번씩 */ else{lane=Math.random()*S.lanes|0;if(lane===last)lane=(lane+1)%S.lanes;}
    last=lane;
    S.obs.push({t:'↓',name:'깃털',boss:true,lanes:[lane],warnAt:at,arrive:at+BOSS.warn,judged:false,id:'b'+B.round+'_'+i});
    at+=BOSS.warn+BOSS.rest;
  });
  B.attackEnd=at;
  const watch=()=>{if(!S||!S.boss)return;const pend=S.obs.some(o=>o.boss&&!o.judged);if(pend||S.rt<B.attackEnd-BOSS.rest+.6){later(watch,150);return;}bossGroggy();};
  later(watch,300);
}
function bossGroggy(){
  const B=S.boss;B.phase='groggy';B.state='groggy';const ci=Math.random()*3|0;B.wp=ci;B.tries=0;
  sfx('boss');updatePrompt(WORDS[ci]);$('prompt').classList.add('weak');
  later(()=>{banner('지금이야!','약점은 '+WORDS[ci]+'!');say('약점은 '+WORDS[ci]);},400);
  later(()=>hint('🎯 그림과 같은 글자 문으로! 맞히면 보스가 아파해요',3000),1800);
  later(()=>spawnWeakGate(),2600);
}
function spawnWeakGate(hintOn){
  const B=S.boss;const opts=shuf([0,1,2]);const item={correct:B.wp,opts,lane:opts.indexOf(B.wp)};
  const g={z:99,arrive:S.rt+BOSS.gateT,item,judged:false,bossGate:true,doors:opts.map((wi,l)=>({wi,l,broken:false,wrong:false,shake:0,reveal:hintOn&&wi===B.wp?1:0})),gateIdx:99};
  S.gates.push(g);S.cur=g;say(WORDS[B.wp]);
}
function bossGateResult(ok,g,d){
  const B=S.boss;B.tries++;
  if(ok||B.tries>=BOSS.autoAfter){
    const auto=!ok; if(d){d.broken=true;d.brokenAt=S.t;} burst(S.laneX,JZ,'#ffd84d');
    big(auto?'➜ 돌진!':'명중! ⚡');sfx('combo');S.score+=20;$('score').textContent='⭐ '+S.score;
    S.fx.push({kind:'shot',t0:S.t,dur:.55}); /* 캐릭터 → 보스 빛의 공격 */
    later(()=>{B.hp--;renderHp();B.flash=1;B.state='hurt';shake(450);sfx('defeat');flash();burstAt(bossPos().x,bossPos().y,'#fff',30);
      later(()=>{B.flash=0;},160);
      if(B.hp<=0){later(bossDefeat,1300);}
      else{B.round++;later(()=>{B.state='fight';sfx('roar');updatePrompt(null);$('prompt').classList.remove('weak');},1700);later(bossRound,2800);}
    },560);
  }else{
    if(d){d.wrong=true;d.shake=1;}
    sfx('roar');big('다시!');B.state='roar';
    later(()=>{B.state='groggy';say('약점은 '+WORDS[B.wp]);sfx('correct');},900);
    later(()=>spawnWeakGate(true),2200);
  }
}
function bossDefeat(){
  const B=S.boss;B.phase='defeat';B.state='stagger';sfx('boss');
  later(()=>{B.state='exit';B.exitT=S.t;for(let i=0;i<40;i++)S.parts.push({x:bossPos().x+(Math.random()-.5)*200,y:bossPos().y+(Math.random()-.5)*120,vx:(Math.random()-.5)*300,vy:-100-Math.random()*300,life:1.4,c:'#555',r:10,rot:Math.random()*6,txt:'🪶'});},700);
  later(()=>{banner('보스를 물리쳤어요! 🏆','들판의 까마귀 대장 퇴장');sfx('clear');},1500);
  later(()=>{S.done=true;S.running=false;$('card').innerHTML='<h2>보스 클리어! 🏆</h2><div class="stars">⭐⭐⭐</div><p>'+BOSS.name+' 격파 · 점수 '+S.score+' · 공격 피함 '+S.dodges+' · 맞음 '+S.hits+'</p>'
    +'<button class="btn boss" id="again1">보스 ① 다시</button><button class="btn boss2" id="again2">보스 ② 다시</button><button class="btn sub" id="menu">단계 고르기</button>';

    const tx=laneX(S.targetLane,S.lanes);S.laneX+=(tx-S.laneX)*Math.min(1,dt*12);if(Math.abs(tx-S.laneX)<1)S.laneX=tx;S.lane=S.targetLane;
    for(const g of S.gates){g.z=JZ+(g.arrive-S.rt)*S.spd;if(!g.judged&&g.z<=ZFAR+.3&&S.cur!==g&&!g.spawned){g.spawned=true;S.cur=g;updatePrompt(WORDS[g.item.correct]);if(!g.bossGate)say(WORDS[g.item.correct]);}
      if(!g.judged&&S.rt>=g.arrive)judgeGate(g);g.doors.forEach(d=>{if(d.shake>0)d.shake=Math.max(0,d.shake-dt*2.2);});}
    S.gates=S.gates.filter(g=>!g.judged||g.z>1.08);
    for(const o of S.obs){o.z=o.boss?(JZ+(o.arrive-S.rt)*S.spd):(JZ+(o.arrive-S.rt)*S.spd);if(o.boss&&!o.warned&&S.rt>=o.warnAt){o.warned=true;sfx('warn');S.boss.face=o.lanes[0];}
      if(!o.judged&&S.rt>=o.arrive){judgeOb(o);o.doneAt=S.t;if(o.boss)S.boss.face=null;}}
    S.obs=S.obs.filter(o=>o.boss?(!o.judged||S.t-o.doneAt<.5):(o.z>.9));
    for(const tr of S.trees){tr.z-=v*dt;if(tr.z<.45)Object.assign(tr,mkTree(ZFAR+2+Math.random()*2));}
    for(const f of S.flowers){f.z-=v*dt;if(f.z<.5)Object.assign(f,mkFlower(ZFAR+2+Math.random()*2));}
  }
  buildCurve(S.dist);
  ctx.clearRect(0,0,W,H);drawSky();drawGround();
  const objs=[];for(const t of S.trees)objs.push({z:t.z,k:'t',o:t});for(const f of S.flowers)objs.push({z:f.z,k:'f',o:f});for(const g of S.gates)objs.push({z:g.z,k:'g',o:g});for(const o of S.obs)if(!o.boss)objs.push({z:o.z,k:'o',o});
  objs.sort((a,b)=>b.z-a.z);
  let bossDrawn=false;
  for(const o of objs){if(!bossDrawn&&o.z<5.2&&S.boss){drawBoss();bossDrawn=true;}if(o.k==='t')drawTree(o.o);else if(o.k==='f')drawFlower(o.o);else if(o.k==='g')drawGate(o.o);else drawOb(o.o);}
  if(!bossDrawn&&S.boss)drawBoss();
  for(const o of S.obs)if(o.boss)drawStrike(o);
  drawFx();drawParts(dt);placeRacer();
}
requestAnimationFrame(frame);

/* ====== 홈페이지 미리보기: 2단계(2차선 · 하) 처음부터 관문 3개 → 반복, 자동 조작, 무음 ====== */
const PV={paused:true,loops:0,tapAt:-9,
  /* 관문 3개: 정답 차선을 오른쪽 → 왼쪽 → 오른쪽으로 두어 차선 바꾸기가 잘 보이게 */
  plan:[{correct:0,opts:[1,0]},{correct:1,opts:[1,2]},{correct:2,opts:[0,2]}],
  start(){
    if(S)S.timers.forEach(clearTimeout);
    startStage(1);
    PV.loops++;PV.steered=null;PV.endAt=null;
    $('pvHand').classList.remove('show');$('pvTap').classList.remove('show');
  },
  tick(dt){
    if(!S)return;
    if(!S.running&&!S.done&&S.t>=1.5){S.running=true;}
    /* 다음 관문이 가까워지면(약 1.6초 전) 정답 차선 쪽을 '터치' */
    const g=S.cur;
    if(S.running&&g&&!g.judged&&PV.steered!==g&&g.z<5.1){
      PV.steered=g;
      const d=g.item.lane-S.targetLane;
      if(d!==0){PV.tap(d>0?1:-1);move(d>0?1:-1);}
    }
    if(S.t-PV.tapAt>.75)$('pvHand').classList.remove('show');
    if(S.done){if(PV.endAt==null)PV.endAt=S.t;else if(S.t-PV.endAt>1.9)PV.start();}
  },
  tap(dir){
    const x=dir>0?CX+455:CX-455,t=$('pvTap'),h=$('pvHand');
    t.style.left=x+'px';h.style.left=x+'px';
    t.classList.remove('show');void t.offsetWidth;t.classList.add('show');h.classList.add('show');PV.tapAt=S.t;
  },
  setPaused(v){PV.paused=!!v;const w=$('wrap');if(PV.paused)w.setAttribute('data-paused','');else w.removeAttribute('data-paused');}
};
sfx=function(){};say=function(){};finish=function(){};
STAGES[1].gates=3;STAGES[1].fx=null;
buildQueue=function(st){return PV.plan.slice(0,st.gates).map(p=>({correct:p.correct,opts:p.opts.slice(),lane:p.opts.indexOf(p.correct)}));};
function fit(){const s=Math.max(innerWidth/W,innerHeight/H);$('wrap').style.transform='scale('+s+')';
  const crop=Math.max(0,(W-innerWidth/s)/2);document.documentElement.style.setProperty('--pv-inset',(22+crop)+'px');}
addEventListener('resize',fit);fit();
window.addEventListener('message',e=>{
  if(e.source!==window.parent)return;const d=e.data;
  if(!d||typeof d!=='object'||d.type!=='glim-preview-control')return;
  if(d.action==='play')PV.setPaused(false);else if(d.action==='pause')PV.setPaused(true);else if(d.action==='restart'){PV.start();PV.setPaused(false);}
});
window.__GLIM_PREVIEW_STATE__=()=>({game:'racing',paused:PV.paused,loops:PV.loops,t:S&&Math.round(S.t*10)/10,results:S&&S.results.slice(),lane:S&&S.targetLane,stage:S&&S.st.label});
PV.start();PV.setPaused(true);placeRacer();
(function(){
  const imgs=[...document.images].map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve());
  const fonts=document.fonts&&document.fonts.load?document.fonts.load('400 40px Jua','배소귀 2단계 차선 하 출발 좋아요 잘했어요 최고 다시 해봐요 0123456789').catch(()=>{}):Promise.resolve();
  Promise.all([fonts].concat(imgs)).then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(window.parent!==window)window.parent.postMessage({type:'glim-preview-ready',game:'racing'},'*');
    else PV.setPaused(false); /* 단독으로 열면 바로 재생 */
  })));
})();
</script>
